{% set name = "git-credential-manager" %}
{% set version = "3.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/GitCredentialManager/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 561cd3c664a314e20dec9fad504c50bba6975b29aaf68c342daf1820130fa8bc
  patches:
    - 00000-no_self_contained.patch  # [not aarch64 and not arm64]
    - 00001-set_linux_runtime.patch  # [linux]

build:
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}  # [linux]
    - {{ stdlib("c") }}  # [linux]
    - dotnet =8.0.100
  host:
    - fontconfig  # [linux]
    - zlib  # [aarch64]
  run:
    - dotnet-runtime =8

test:
  requires:
    - git
  commands:
    - git credential-manager --version

about:
  home: https://github.com/git-ecosystem/git-credential-manager
  summary: Secure, cross-platform Git credential storage
  description: |
    Secure, cross-platform Git credential storage with authentication to
    GitHub, Azure Repos, and other popular Git hosting services.
  license: MIT
  license_file:
    - LICENSE
    - NOTICE
  dev_url: https://github.com/git-ecosystem/git-credential-manager
  doc_url: https://github.com/git-ecosystem/git-credential-manager/tree/main/docs

extra:
  recipe-maintainers:
    - dhirschfeld
    - sshockwave
