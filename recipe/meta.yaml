{% set name = "git-credential-manager" %}
{% set version = "2.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/git-ecosystem/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 248468dcaf111402892c56d4cbc370dcfc1429976e7abcc1120c49757779be39
  patches:
    # Keep self-contained on aarch64/arm64 (no shared framework path there).
    - 00000-no_self_contained.patch  # [not aarch64 and not arm64]

build:
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}  # [linux]
    - {{ stdlib("c") }}  # [linux]
    # Upstream 2.8+ targets net10.0; CF uses the same pin. pkgs/main currently
    # only has dotnet 8.0.100 — bump dotnet-feedstock before this can build.
    - dotnet =10.0.100
  host:
    - fontconfig {{ fontconfig }}  # [linux]
    - zlib {{ zlib }}  # [aarch64]
  run:
    - dotnet-runtime =10

test:
  requires:
    - git
  commands:
    - git credential-manager --version

about:
  home: https://github.com/git-ecosystem/git-credential-manager
  summary: Secure, cross-platform Git credential storage
  description: |
    Secure, cross-platform Git credential storage with authentication to
    GitHub, Azure Repos, and other popular Git hosting services.
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - NOTICE
  dev_url: https://github.com/git-ecosystem/git-credential-manager
  doc_url: https://github.com/git-ecosystem/git-credential-manager/tree/main/docs

extra:
  recipe-maintainers:
    - dhirschfeld
    - sshockwave
